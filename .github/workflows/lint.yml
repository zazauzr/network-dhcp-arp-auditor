name: PowerShell Linting & Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $Results = Invoke-ScriptAnalyzer -Path ./ -Recurse -Severity Error, Warning
          if ($Results) {
              $Results | Format-Table -AutoSize
              throw "PSScriptAnalyzer found issues in automation scripts."
          } else {
              Write-Host "All scripts passed static code analysis successfully."
          }
